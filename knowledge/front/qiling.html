<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>器灵 · 设备手册问答台</title>
<style>
  :root{
    --paper:#f6f2ea; --card:#fffdf8; --ink:#22262b; --muted:#8a8378;
    --line:#ddd3c2; --bronze:#a5551d; --teal:#23606b; --seal:#b4531f;
    --ok:#3d7a4f; --bad:#a33b2e; --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100vh;display:flex;overflow:hidden;color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background-color:var(--paper);
    background-image:
      linear-gradient(rgba(34,38,43,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(34,38,43,.045) 1px,transparent 1px);
    background-size:28px 28px;
  }
  /* ---------- 左侧：会话栏（墨色） ---------- */
  #sidebar{
    width:248px;flex:none;background:#20242a;color:#e8e2d6;
    display:flex;flex-direction:column;border-right:3px solid var(--bronze);
  }
  .brand{padding:20px 18px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand h1{font-family:"Songti SC","SimSun",serif;font-size:26px;letter-spacing:6px;color:#f0e9db}
  .brand h1 em{font-style:normal;color:var(--seal)}
  .brand p{font-size:11px;color:#9a927f;margin-top:6px;letter-spacing:1px;font-family:var(--mono)}
  #newSession{
    margin:14px 14px 8px;padding:9px;border:1px dashed #6b6353;background:transparent;color:#d8d0bf;
    cursor:pointer;font-size:13px;letter-spacing:2px;transition:.2s;
  }
  #newSession:hover{border-color:var(--seal);color:var(--seal)}
  #sessionList{flex:1;overflow-y:auto;padding:6px 10px}
  .s-item{
    padding:9px 10px;margin-bottom:6px;cursor:pointer;font-size:13px;line-height:1.4;
    border-left:2px solid transparent;color:#bdb5a2;display:flex;justify-content:space-between;gap:6px;
  }
  .s-item:hover{background:rgba(255,255,255,.05)}
  .s-item.on{border-left-color:var(--seal);background:rgba(255,255,255,.07);color:#f0e9db}
  .s-item .del{opacity:0;color:#8a8378;font-family:var(--mono)}
  .s-item:hover .del{opacity:.8}
  .s-item .del:hover{color:var(--bad)}
  .side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
  .side-foot button{
    width:100%;padding:8px;background:transparent;border:1px solid #6b6353;color:#d8d0bf;cursor:pointer;font-size:12px;
  }
  .side-foot button:hover{border-color:var(--bad);color:#e08a7c}
  .side-foot .go{display:block;margin-top:8px;text-align:center;color:#9a927f;text-decoration:none;font-family:var(--mono);font-size:11px}
  .side-foot .go:hover{color:var(--seal)}

  /* ---------- 主区 ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  header{
    display:flex;align-items:center;gap:12px;padding:12px 22px;
    border-bottom:1px solid var(--line);background:rgba(255,253,248,.9);
  }
  header .seal{
    font-family:"Songti SC","SimSun",serif;font-size:15px;color:var(--seal);
    border:2px solid var(--seal);padding:1px 7px;transform:rotate(-5deg);letter-spacing:3px;
  }
  header .t{font-size:14px;font-weight:600;letter-spacing:1px}
  header .sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
  header .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--ok)}
  header .dot.off{background:#b9b1a2}

  #stream{flex:1;overflow-y:auto;padding:22px 26px 10px}
  #stream::-webkit-scrollbar{width:8px}
  #stream::-webkit-scrollbar-thumb{background:var(--line)}

  /* 图纸角标卡片 */
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);
    padding:14px 16px;margin-bottom:16px;max-width:860px;font-size:14px;line-height:1.75;
  }
  .card::before,.card::after{content:'';position:absolute;width:11px;height:11px;border-color:var(--bronze);border-style:solid}
  .card::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .card::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
  .card .tag{
    position:absolute;top:-9px;left:14px;background:var(--bronze);color:#fff;
    font-size:10px;padding:1px 8px;letter-spacing:3px;font-family:var(--mono);
  }
  .card.user{margin-left:auto;border-color:#c9cbd6}
  .card.user::before,.card.user::after{border-color:#5a6b8c}
  .card.user .tag{background:#5a6b8c}
  .card .meta{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:8px;letter-spacing:.5px}

  /* 流水线 chips */
  .pipe{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px;padding:8px 10px;background:#faf6ec;border:1px dashed var(--line)}
  .pipe .st{font-size:11px;font-family:var(--mono);padding:2px 9px;border:1px solid var(--line);background:#fff;position:relative}
  .pipe .st.done{border-color:var(--ok);color:var(--ok)}
  .pipe .st.done::after{content:' ✓'}
  .pipe .st.run{border-color:var(--bronze);color:var(--bronze);animation:pulse 1.2s infinite}
  .pipe .st.run::after{content:' …'}
  .pipe .status{font-size:11px;font-family:var(--mono);color:var(--muted);align-self:center;margin-left:4px}
  @keyframes pulse{50%{opacity:.45}}

  /* markdown 与代码 */
  .card h3{font-size:15px;margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:4px}
  .card ul{margin:6px 0 6px 20px}
  .card li{margin:3px 0}
  .card pre{background:#20242a;color:#e8e2d6;padding:10px 12px;margin:8px 0;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6}
  .card code.ic{background:#efe9dc;padding:1px 5px;font-family:var(--mono);font-size:12.5px;color:var(--teal)}
  .card pre code{font-family:var(--mono)}
  .cursor{display:inline-block;width:8px;height:15px;background:var(--bronze);vertical-align:-2px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* 图片墙 + 灯箱 */
  .gallery{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
  .gallery img{height:120px;border:1px solid var(--line);cursor:zoom-in;object-fit:cover;transition:.15s}
  .gallery img:hover{border-color:var(--bronze);transform:translateY(-2px)}
  #lightbox{position:fixed;inset:0;background:rgba(20,20,20,.88);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
  #lightbox img{max-width:92vw;max-height:92vh;border:4px solid #fff}
  #lightbox.on{display:flex}

  /* options 候选 */
  .opts{margin-top:10px}
  .opts .cap{font-size:12px;color:var(--teal);margin-bottom:6px}
  .opts button{
    display:inline-block;margin:0 8px 8px 0;padding:6px 14px;background:#fff;border:1px solid var(--teal);
    color:var(--teal);font-size:13px;cursor:pointer;transition:.15s;
  }
  .opts button:hover{background:var(--teal);color:#fff}

  /* 输入区 */
  #composer{padding:14px 26px 18px;border-top:1px solid var(--line);background:rgba(255,253,248,.92)}
  .input-wrap{display:flex;gap:10px;align-items:flex-end;max-width:860px}
  textarea{
    flex:1;resize:none;border:1px solid var(--line);background:var(--card);padding:10px 12px;
    font-size:14px;font-family:inherit;line-height:1.5;max-height:130px;outline:none;min-height:44px;
  }
  textarea:focus{border-color:var(--bronze)}
  .btn{
    flex:none;padding:10px 20px;border:1px solid var(--ink);background:var(--ink);color:#f0e9db;
    cursor:pointer;font-size:14px;letter-spacing:2px;transition:.15s;
  }
  .btn:hover{background:var(--bronze);border-color:var(--bronze)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.stop{background:transparent;color:var(--bad);border-color:var(--bad)}
  .hint{max-width:860px;font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:6px;letter-spacing:.5px}

  #toast{
    position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#f0e9db;
    padding:9px 20px;font-size:13px;display:none;z-index:100;border-left:3px solid var(--seal);
  }
  .sample{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .sample button{font-size:12px;padding:4px 12px;background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .sample button:hover{border-color:var(--bronze);color:var(--bronze)}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <h1>器<em>·</em>灵</h1>
    <p>QILING · MANUAL RAG CONSOLE</p>
  </div>
  <button id="newSession">＋ 新建会话</button>
  <div id="sessionList"></div>
  <div class="side-foot">
    <button id="clearHistory">清空当前会话历史</button>
    <a class="go" id="goForge" href="#">→ 前往铸灵台（导入手册）</a>
  </div>
</aside>

<main>
  <header>
    <span class="seal">器灵</span>
    <span class="t">设备手册问答台</span>
    <span class="sub">QILING / QUERY CONSOLE</span>
    <span class="dot" id="connDot"></span>
  </header>

  <div id="stream"></div>

  <div id="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="向器灵提问，例如：如何使用万用表测量电压？"></textarea>
      <button class="btn" id="sendBtn">问 灵</button>
      <button class="btn stop" id="stopBtn" style="display:none">停止显示</button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行 · 流式回答基于手册切片与联网检索</div>
  </div>
</main>

<div id="lightbox"><img alt=""></div>
<div id="toast"></div>

<script>
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const streamEl=$('#stream'), inputEl=$('#input');
let busy=false, currentEs=null, lastQuestion='';
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}
function scrollBottom(){streamEl.scrollTop=streamEl.scrollHeight;}
function sibling(path){
  const otherPort = location.port==='8000' ? '8001' : '8000';
  return location.protocol+'//'+location.hostname+':'+otherPort+path;
}
$('#goForge').href = sibling('/front/forge.html');

/* ================= 会话管理 ================= */
let sessions = JSON.parse(localStorage.getItem('qiling_sessions_v1')||'[]');
let activeId = localStorage.getItem('qiling_active_v1')||'';
function saveSessions(){
  localStorage.setItem('qiling_sessions_v1',JSON.stringify(sessions));
  localStorage.setItem('qiling_active_v1',activeId);
}
function genId(){return 'q'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function renderSessions(){
  const box=$('#sessionList'); box.innerHTML='';
  sessions.forEach(s=>{
    const div=document.createElement('div');
    div.className='s-item'+(s.id===activeId?' on':'');
    div.innerHTML=`<span>${(s.title||'新会话').slice(0,14)}</span><span class="del" data-id="${s.id}">✕</span>`;
    div.onclick=e=>{
      if(e.target.classList.contains('del')){
        sessions=sessions.filter(x=>x.id!==s.id);
        if(activeId===s.id){activeId=sessions[0]?sessions[0].id:'';if(activeId)loadHistory(activeId);else newSession();}
        saveSessions();renderSessions();return;
      }
      activeId=s.id;saveSessions();renderSessions();loadHistory(activeId);
    };
    box.appendChild(div);
  });
}
function ensureSession(){
  if(activeId && sessions.some(s=>s.id===activeId))return;
  newSession();
}
function newSession(){
  const s={id:genId(),title:'',time:Date.now()};
  sessions.unshift(s);activeId=s.id;saveSessions();renderSessions();
  streamEl.innerHTML='';addWelcome();inputEl.focus();
}
function touchSession(q){
  const s=sessions.find(x=>x.id===activeId);
  if(s && !s.title){s.title=q.slice(0,16);saveSessions();renderSessions();}
}
$('#newSession').onclick=newSession;
$('#clearHistory').onclick=async()=>{
  if(!activeId)return;
  try{await fetch('/history/'+activeId,{method:'DELETE'});toast('历史已清空');loadHistory(activeId);}
  catch(e){toast('清空失败：'+e.message);}
};

/* ================= 消息卡片 ================= */
function addWelcome(){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`
    <span class="tag">QILING</span>
    <p>我是<strong>器灵</strong>——铸造于设备手册之上的问答之灵。</p>
    <p style="margin-top:6px">把手册交给我，我来替你翻。提问后，卡片顶部的<span style="color:var(--bronze)">流水线</span>会显示检索进度。</p>
    <div class="sample">
      <button data-q="万用表怎么测电压？">万用表怎么测电压？</button>
      <button data-q="H3C LA2608室内无线网关如何配置与无线控制器互通？">LA2608 组网配置</button>
    </div>`;
  c.querySelectorAll('.sample button').forEach(b=>b.onclick=()=>{inputEl.value=b.dataset.q;inputEl.focus();autosize();});
  streamEl.appendChild(c);
}
function addUserCard(q){
  const c=document.createElement('div');c.className='card user';
  const time=new Date().toLocaleTimeString('zh-CN',{hour12:false});
  c.innerHTML=`<span class="tag">问</span><p>${escapeHtml(q)}</p><div class="meta">${time}</div>`;
  streamEl.appendChild(c);scrollBottom();
}
function addAnswerCard(){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<span class="tag">答 · 器灵</span><div class="pipe"></div><div class="body"></div>`;
  c.buffer='';c.done=false;
  streamEl.appendChild(c);scrollBottom();
  return c;
}
function updateStepper(card,d){
  const pipe=card.querySelector('.pipe');pipe.innerHTML='';
  (d.done_list||[]).forEach(n=>{
    const s=document.createElement('span');s.className='st done';s.textContent=n;pipe.appendChild(s);
  });
  (d.running_list||[]).forEach(n=>{
    const s=document.createElement('span');s.className='st run';s.textContent=n;pipe.appendChild(s);
  });
  const st=document.createElement('span');st.className='status';
  st.textContent={processing:'运行中',completed:'已完成',failed:'异常'}[d.status]||d.status||'';
  pipe.appendChild(st);
}

/* ================= 渲染：markdown / 图片 / 候选 ================= */
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderMarkdown(src){
  const codes=[];
  src=src.replace(/```([\s\S]*?)```/g,(m,c)=>{codes.push(c);return '\u0000C'+(codes.length-1)+'\u0000';});
  let h=escapeHtml(src);
  h=h.replace(/^### (.*)$/gm,'<h4>$1</h4>').replace(/^## (.*)$/gm,'<h3>$1</h3>').replace(/^# (.*)$/gm,'<h3>$1</h3>');
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/`([^`\n]+)`/g,'<code class="ic">$1</code>');
  h=h.split(/\n{2,}/).map(block=>{
    const lines=block.split('\n').filter(l=>l.trim());
    if(lines.length&&lines.every(l=>/^\s*(-|\d+[.、]|（\d+）|\(\d+\))/.test(l))){
      return '<ul>'+lines.map(l=>'<li>'+l.replace(/^\s*(-|\d+[.、]|（\d+）|\(\d+\))\s*/,'')+'</li>').join('')+'</ul>';
    }
    return '<p>'+block.replace(/\n/g,'<br>')+'</p>';
  }).join('');
  h=h.replace(/\u0000C(\d+)\u0000/g,(m,i)=>'<pre><code>'+escapeHtml(codes[i])+'</code></pre>');
  return h;
}
const MINIO_BASE='http://localhost:9000/';
const IMG_EXT_RE=/\.(jpg|jpeg|png|gif|webp)$/i;
function repairImageUrl(raw){
  let u=String(raw).trim();
  if(!IMG_EXT_RE.test(u))return null;
  u=u.replace(/\s+/g,'%20');                     // LLM把%20还原成空格 → 补回编码
  if(!/^https?:\/\//i.test(u)){                  // LLM抄丢了协议前缀 → 补MinIO地址
    u=/^knowledge-base\//i.test(u)?MINIO_BASE+u:MINIO_BASE+'knowledge-base/'+u;
  }
  return u;
}
function extractImages(text){
  const urls=[],kept=[];
  text.split('\n').forEach(line=>{
    const t=line.trim();
    if(/^【图片】\s*$/.test(t))return;           // 标记行剔除
    const fixed=repairImageUrl(t);
    if(fixed)urls.push(fixed);                   // 整行就是图片URL → 进图片墙
    else kept.push(line);
  });
  return{text:kept.join('\n').replace(/\n{3,}/g,'\n\n').trim(),urls:[...new Set(urls)]};
}
function extractOptions(text){
  const m=text.match(/您是在询问以下产品吗[:：]\s*([^\n？?]+)/);
  if(!m)return{text,options:[]};
  return{text,options:m[1].split(/[、,，]/).map(x=>x.trim()).filter(Boolean)};
}
function renderAnswer(card){
  const body=card.querySelector('.body');
  body.innerHTML=renderMarkdown(card.buffer)+(card.done?'':'<span class="cursor"></span>');
  scrollBottom();
}
function completeStepper(card,isError){
  const pipe=card.querySelector('.pipe');
  if(!pipe)return;
  if(!pipe.children.length){pipe.style.display='none';return;}   // 历史卡没有阶段 → 隐藏虚线框
  pipe.querySelectorAll('.st.run').forEach(s=>{
    s.classList.remove('run');s.classList.add('done');
    s.textContent=s.textContent.replace(/ …$/,'')+' ✓';
  });
  const st=pipe.querySelector('.status');
  if(st)st.textContent=isError?'异常':'已完成';
}
function finalizeAnswer(card,serverAnswer,isError,serverImages){
  card.done=true;
  if(serverAnswer)card.buffer=serverAnswer;   // 服务端最终答案优先（后端整理过图片区块）
  if(!card.buffer&&!isError)card.buffer='（器灵沉默了片刻，没有给出回答）';
  if(isError&&!card.buffer)card.buffer='（连接中断，请重试）';
  completeStepper(card,isError);              // FINAL之后不会再有PROGRESS，前端自己收尾
  let {text,urls}=extractImages(card.buffer);
  if(Array.isArray(serverImages)&&serverImages.length)urls=serverImages.slice();
  let opts=[];({text,options:opts}=extractOptions(text));
  card.buffer=text;
  renderAnswer(card);
  const body=card.querySelector('.body');
  if(urls.length){
    const g=document.createElement('div');g.className='gallery';
    urls.forEach(u=>{const img=document.createElement('img');img.src=u;img.loading='lazy';img.onerror=()=>img.remove();img.onclick=()=>openLightbox(u);g.appendChild(img);});
    body.appendChild(g);
  }
  if(opts.length){
    const box=document.createElement('div');box.className='opts';
    box.innerHTML='<div class="cap">◤ 器灵需要确认，点击其一继续：</div>';
    opts.forEach(o=>{
      const b=document.createElement('button');b.textContent=o;
      b.onclick=()=>{inputEl.value=`我要问的产品是「${o}」。${lastQuestion||''}`;inputEl.focus();autosize();toast('已填入，按 Enter 发送');};
      box.appendChild(b);
    });
    body.appendChild(box);
  }
  card.insertAdjacentHTML('beforeend','<div class="meta">— 器灵 · 本回答基于手册切片与联网检索 —</div>');
  scrollBottom();
}
function openLightbox(u){
  const lb=$('#lightbox');lb.querySelector('img').src=u;lb.classList.add('on');
}
$('#lightbox').onclick=()=>$('#lightbox').classList.remove('on');

/* ================= 发送与 SSE ================= */
async function send(){
  const q=inputEl.value.trim();
  if(!q||busy)return;
  busy=true;setSendState();
  ensureSession();lastQuestion=q;
  addUserCard(q);touchSession(q);
  inputEl.value='';autosize();
  const card=addAnswerCard();
  let es=null,watchdog=null;
  const disarm=()=>{if(watchdog){clearTimeout(watchdog);watchdog=null;}};
  const rearm=()=>{disarm();watchdog=setTimeout(()=>{
    if(!card.done){card.buffer+='\n\n（长时间无响应，已停止等待）';finalizeAnswer(card,null,true);}
    cleanup();
  },90000);};
  const cleanup=()=>{disarm();if(es){es.close();currentEs=null;}busy=false;setSendState();};
  try{
    const res=await fetch('/query',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:q,session_id:activeId,is_stream:true})
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    es=new EventSource('/stream/'+data.task_id);
    currentEs=es;rearm();
    es.addEventListener('progress',e=>{updateStepper(card,JSON.parse(e.data||'{}'));rearm();});
    es.addEventListener('delta',e=>{const d=JSON.parse(e.data||'{}');card.buffer+=d.delta||'';renderAnswer(card);rearm();});
    es.addEventListener('final',e=>{
      const d=JSON.parse(e.data||'{}');
      finalizeAnswer(card,d.answer||null,false,d.images);cleanup();
    });
    es.onerror=()=>{if(card.done)return;finalizeAnswer(card,null,true);cleanup();};
  }catch(err){
    toast('提交失败：'+err.message);cleanup();
  }
}
function setSendState(){
  $('#sendBtn').disabled=busy;
  $('#stopBtn').style.display=busy?'':'none';
}
$('#sendBtn').onclick=send;
$('#stopBtn').onclick=()=>{
  if(currentEs)currentEs.close();currentEs=null;
  busy=false;setSendState();
  toast('已停止显示（后台流程不受影响）');
};
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
function autosize(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,130)+'px';}
inputEl.addEventListener('input',autosize);

/* ================= 启动 ================= */
if(!sessions.length||!activeId){newSession();}
else{renderSessions();loadHistory(activeId);}

async function loadHistory(sid){
  streamEl.innerHTML='';
  try{
    const res=await fetch('/history/'+sid);
    const data=await res.json();
    const items=(data.items||[]).slice().reverse();   // 接口按最新在前返回，反转成时间正序渲染
    if(!items.length){addWelcome();return;}
    items.forEach(it=>{
      if(it.role==='user'){addUserCard(it.text||'');lastQuestion=it.text||'';}
      else if(it.role==='assistant'){
        const c=addAnswerCard();c.buffer=it.text||'';finalizeAnswer(c,null,false);
      }
    });
  }catch(e){addWelcome();toast('历史加载失败：'+e.message);}
  scrollBottom();
}
</script>
</body>
</html>
